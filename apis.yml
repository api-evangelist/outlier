apis:
- name: Outlier UCP Agent Commerce (MCP)
  description: >-
    Shopify-native Universal Commerce Protocol (UCP) shopping surface for the
    Outlier storefront. Agents discover capabilities at /.well-known/ucp and
    transact via the hosted MCP endpoint (search_catalog, create_cart,
    create_checkout, update_checkout, complete_checkout). Checkout requires
    contemporaneous buyer approval. Read-only browsing is available without auth
    via Shopify product/collection JSON endpoints. Customer authentication uses
    Shopify Customer Account OpenID Connect.
  humanURL: https://www.outlier.org/agents.md
  baseURL: https://www.outlier.org/api/ucp/mcp
