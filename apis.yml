name: Outlier
description: >-
  Outlier is a consumer online-education company that delivers college-level,
  for-credit courses (Calculus, Psychology, Financial Accounting, Computer
  Science, Astronomy, Business, and Professional Communication) to high-school
  and independent learners through dual-enrollment partnerships, offering
  transferable credit from an accredited university. Outlier was surfaced as a
  portfolio company of GV (Google Ventures). Its public storefront at
  www.outlier.org runs on Shopify and exposes a real agent-commerce surface:
  an llms.txt / agents.md instruction file, a Universal Commerce Protocol (UCP)
  merchant profile at /.well-known/ucp, a hosted UCP shopping MCP endpoint at
  /api/ucp/mcp, and Shopify Customer Account OpenID Connect discovery at
  /.well-known/openid-configuration. This profile was enriched from those
  publicly served surfaces; there is no first-party developer/API program.
